apply plugin: 'com.android.application'

// Endereço do servidor (o mesmo VITE_API_BASE_URL do .env.android): o receptor dos botões da notificação
// roda em Java, fora do JavaScript, e precisa saber para onde mandar o POST.
def apiBaseUrl = ''
def envAndroid = file('../../.env.android')
if (envAndroid.exists()) {
    envAndroid.eachLine { linha ->
        def m = linha =~ /^\s*VITE_API_BASE_URL\s*=\s*(\S+)\s*$/
        if (m) apiBaseUrl = m[0][1]
    }
}

// Versão do app = versão do repo (webapp/frontend/package.json, ver CLAUDE.md § Versionamento).
// versionCode precisa sempre crescer: 0.62.3 → 6203 (MAJOR*1_000_000 + MINOR*100 + PATCH).
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.-')[0..2].collect { it as int }
def appVersionCode = vMajor * 1000000 + vMinor * 100 + vPatch

// Chave de release (docs/planos/app_android/etapa-2-capacitor-login.md, seção E). A keystore e a senha
// NUNCA entram no git: vêm de android/keystore.properties (no PC, ignorado pelo git) ou de variáveis de
// ambiente (GitHub Actions). Sem nenhum dos dois, o APK de release sai sem assinatura.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def releaseStoreFile = System.getenv('MAKIMA_KEYSTORE_FILE') ?: keystoreProps.getProperty('storeFile')
def releaseStorePassword = System.getenv('MAKIMA_KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def hasReleaseKey = releaseStoreFile && releaseStorePassword && file(releaseStoreFile).exists()

android {
    namespace = "br.com.gustavo.makima"
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias System.getenv('MAKIMA_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias', 'makima')
                // A keystore foi criada com a mesma senha para o arquivo e para a chave.
                keyPassword System.getenv('MAKIMA_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword', releaseStorePassword)
            }
        }
    }
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "br.com.gustavo.makima"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // O serviço de push (MakimaMessagingService) estende a classe do plugin, que herda do Firebase.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
