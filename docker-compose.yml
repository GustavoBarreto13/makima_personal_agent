# Deploy da Makima: bot Telegram.
# O banco PostgreSQL é gerenciado como serviço separado no Dokploy (Databases → makima-db).
# A variável DATABASE_URL é configurada no painel do Dokploy → Environment.
services:

  # COMENTADO (spec 064, cutover do Telegram pro Hermes — ver hermes/CLAUDE.md).
  # ATENÇÃO: comentar aqui e redeployar esta app NÃO para o container makima-bot
  # sozinho — `docker compose up -d` (o comando padrão do Dokploy) não remove
  # containers "órfãos" de serviços que saíram do arquivo, só de propósito com
  # `--remove-orphans`. Depois de redeployar com este bloco comentado, ou:
  #   (a) adicionar `--remove-orphans` ao comando de deploy desta app no Dokploy
  #       (Advanced → Custom Command), ou
  #   (b) pedir pra eu confirmar/remover o container órfão via SSH (só leitura +
  #       ação pontual, não é um "deploy" — mas confirme comigo antes).
  # Rollback: descomentar este bloco e redeployar de novo.
  # makima:
  #   build:
  #     # Contexto = raiz do repo (para COPY . . pegar coordinator/ e agents/).
  #     context: .
  #     dockerfile: coordinator/Dockerfile
  #   container_name: makima-bot
  #   # Injeta variáveis do .env para desenvolvimento local.
  #   # No Dokploy as vars vêm do painel de Environment, não deste arquivo.
  #   env_file: .env
  #   # Reinicia o bot automaticamente se cair ou no boot do host.
  #   restart: unless-stopped
  #   networks:
  #     # Rede padrão do compose (isolamento do serviço)
  #     - default
  #     # Rede compartilhada do Dokploy onde o banco PostgreSQL separado roda
  #     - dokploy-network

  # Servidor MCP HTTP: expõe as tools de domínio (Nami, Kaguya, Calendar, ...) para
  # qualquer cliente MCP — hoje o Hermes (spec 064, ver docker-compose.hermes.yml). Um
  # FastMCP por domínio, montado sob /mcp/<domínio> num único processo
  # Starlette/uvicorn. Só na rede interna (dokploy-network) — nenhuma porta pública.
  # Autenticado por MAKIMA_MCP_TOKEN.
  mcp:
    build:
      # Contexto = raiz do repo (para COPY . . pegar agents/ e mcp_servers/).
      context: .
      dockerfile: mcp_servers/makima/Dockerfile
    container_name: makima-mcp
    env_file: .env
    restart: unless-stopped
    networks:
      - default
      - dokploy-network

  web:
    build:
      # Contexto = raiz do repo (para COPY . . e COPY webapp/frontend/ funcionarem corretamente).
      context: .
      dockerfile: webapp/backend/Dockerfile
    container_name: makima-web
    # Injeta variáveis do .env para desenvolvimento local.
    # No Dokploy as vars vêm do painel de Environment, não deste arquivo.
    env_file: .env
    # Reinicia automaticamente se o container cair ou no boot do host.
    restart: unless-stopped
    ports:
      # Expõe a porta 8080 do container como 8080 no host.
      # O reverse proxy do Dokploy vai rotear o subdomínio para esta porta.
      - "8080:8080"
    networks:
      # Rede padrão do compose (isolamento do serviço)
      - default
      # Rede compartilhada do Dokploy (acesso ao banco e outros serviços)
      - dokploy-network

  # Interface web leve para inspecionar e editar o PostgreSQL via navegador.
  # Acessível apenas em localhost:8082 — não expõe para a internet.
  adminer:
    image: adminer:4-standalone
    container_name: makima-adminer
    restart: unless-stopped
    ports:
      # Vincula ao loopback para não expor publicamente — use SSH tunnel se necessário
      - "127.0.0.1:8082:8080"
    networks:
      - dokploy-network
    environment:
      # Pré-seleciona o host do banco na tela de login do Adminer
      ADMINER_DEFAULT_SERVER: ${DB_HOST:-localhost}

  # Serviço de agendamento: roda TODOS os jobs recorrentes (backup, sync da Kurisu,
  # sync do Letterboxd, etc.) num único container, com horários fixos via APScheduler.
  #
  # Substitui os dois antigos serviços de loop (`backup` e `kurisu-sync`, cada um com
  # `while true; sleep 86400`). Vantagens: horário FIXO (não flutua com o redeploy),
  # adicionar job novo = 1 linha em scheduler/registry.py (não um serviço novo aqui),
  # e observabilidade (tabela scheduler_runs + alerta no Telegram em falha).
  #
  # Usa uma imagem própria (scheduler/Dockerfile) porque o job de backup precisa do
  # binário pg_dump, que a imagem do webapp não traz. Ver scheduler/CLAUDE.md.
  #
  # Pré-requisitos no Environment: DATABASE_URL, GCP_* / GCS_BACKUP_BUCKET (backup),
  # VERTEX_RAG_CORPUS_OPERACIONAL (Kurisu), LETTERBOXD_USERNAME (Akane),
  # TELEGRAM_BOT_TOKEN + TELEGRAM_ALERT_CHAT_ID (alertas de falha).
  scheduler:
    build:
      # Contexto = raiz do repo (para o COPY . . pegar agents/, scripts/, scheduler/).
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: makima-scheduler
    restart: unless-stopped
    env_file: .env
    networks:
      - dokploy-network

# Declara a rede do Dokploy como externa — já existe, não criamos aqui
networks:
  dokploy-network:
    external: true
