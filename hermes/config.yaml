# Template de config.yaml do Hermes Agent (spec 064 — Etapa E3/E4).
#
# NÃO é lido automaticamente pelo Hermes: é uma referência versionada, copiada/mesclada
# manualmente em $HERMES_HOME/config.yaml (volume "hermes_data", montado em /opt/data no
# container makima-hermes — ver docker-compose.hermes.yml) na primeira configuração.
#
# Schema de `model`/`mcp_servers`/`platforms` abaixo já foi confirmado contra a
# documentação pública do Hermes Agent (hermes-agent.nousresearch.com, consultada em
# 09/ago/2026) — ver changelog em hermes/CLAUDE.md. Ainda ficam como "verificar depois",
# sem confirmação externa: o bloco `tools.terminal` e a chave `profile: default`, e a
# nidificação de `whatsapp`/`discord` sob `platforms:` (inferida por convenção a partir
# do schema confirmado do `telegram`, não checada linha a linha). Confirme com
# `hermes config get` / `hermes --help` antes do primeiro boot.

model:
  provider: custom
  # gemini-3.6-flash, não gemini-2.5-flash — escolhido após teste real de tool-calling
  # via a app Hermes deployada (ver changelog em hermes/CLAUDE.md): o 2.5-flash falhou
  # ~60% das vezes em tools com argumentos obrigatórios (adivinhava nome de argumento
  # errado ou pulava a chamada), enquanto o 3.6-flash consultou o schema (`tool_describe`)
  # antes de chamar e acertou 100% nos mesmos testes. Também evita a migração forçada do
  # 2.5-flash, que desliga em 16/out/2026.
  model: gemini-3.6-flash
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  # api_key interpolado direto de ${GEMINI_API_KEY} (já presente no .env raiz do
  # repo/Environment do Dokploy, usado pelos outros serviços) — não precisa de um
  # OPENAI_API_KEY separado.
  api_key: "${GEMINI_API_KEY}"

# Etapa E5 (voz/imagem, spec 064) — STT e visão já vêm ligados por padrão no Hermes
# (achado ao investigar: `hermes config get stt`/`hermes tools list` confirmaram os dois
# ativos sem nenhuma config nossa). Trazemos os dois pro template versionado por dois
# motivos: (1) deixar de depender de default implícito e não documentado; (2) corrigir
# um achado real em produção — `stt.language` estava em `en` (provavelmente herdado de
# um teste anterior via CLI), o que degrada a transcrição de áudio em português. `image_input_mode`
# permanece "auto" (default) — com Gemini (suporta visão nativa), o Hermes já anexa os
# pixels da imagem diretamente ao modelo em vez de rodar um modelo auxiliar de descrição.
stt:
  enabled: true
  provider: local   # faster-whisper, roda no próprio container — grátis, sem API key
  language: pt       # corrigido de "en" — a maioria dos áudios recebidos é em português
  echo_transcripts: true   # ecoa a transcrição ao usuário antes do agente responder —
                            # útil pro fluxo "bullet de diário por voz" (spec 064 E5):
                            # o usuário confirma visualmente que a fala foi entendida

agent:
  image_input_mode: auto   # native quando o modelo suporta visão (caso do Gemini) —
                            # pixels reais + descrição textual automática injetada no
                            # texto da mensagem antes do turno do agente

# Um bloco por domínio MCP montado em makima-mcp (mcp_servers/makima/app.py), chaveado
# por nome (dict, não lista). Espelha mcp_servers/makima/registry.py.DOMAINS — desde a
# Etapa E6, os 9 domínios migrados (nami, kaguya + os 7 que faltavam) + calendar + legacy
# (legacy fica vazia até a Etapa E7 remover o bloco por completo).
# Ver specs/064-hermes-multicanal/contracts/mcp-servers.md.
mcp_servers:
  nami:
    url: "http://makima-mcp:8090/mcp/nami"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  kaguya:
    url: "http://makima-mcp:8090/mcp/kaguya"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  frieren:
    url: "http://makima-mcp:8090/mcp/frieren"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  akane:
    url: "http://makima-mcp:8090/mcp/akane"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  komi:
    url: "http://makima-mcp:8090/mcp/komi"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  marin:
    url: "http://makima-mcp:8090/mcp/marin"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  mai:
    url: "http://makima-mcp:8090/mcp/mai"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  lucy:
    url: "http://makima-mcp:8090/mcp/lucy"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  kurisu:
    url: "http://makima-mcp:8090/mcp/kurisu"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  journal:
    # Personalidade "Violet" (Auto Memory Doll) — o pacote continua agents/journal/ e a
    # chave MCP continua "journal" por convenção (nome do pacote), mesmo padrão já usado
    # pelo provedor de hábito "violet_diary" apontando pra agents.journal.habit_provider.
    url: "http://makima-mcp:8090/mcp/journal"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  calendar:
    url: "http://makima-mcp:8090/mcp/calendar"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
  legacy:
    url: "http://makima-mcp:8090/mcp/legacy"
    headers:
      Authorization: "Bearer ${MAKIMA_MCP_TOKEN}"
    # perguntar_makima_legado segue registrada, mas sem domínio para rotear desde a
    # Etapa E6 (_LEGACY_DOMAIN_AGENTS vazia). Este bloco inteiro é removido na Etapa E7.

# Tools de terminal/execução de código do Hermes MUST permanecer desabilitadas — agente
# mexe em finanças e email pessoal (Technical Context / Constraints do plan.md).
tools:
  terminal:
    enabled: false

# Perfil único para todos os canais e domínios (research.md #8) — memória unificada, sem
# fragmentar por área da vida.
profile: default

platforms:
  telegram:
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    # chat_id real via ${VAR} (não hardcoded no git — mesma convenção de
    # TELEGRAM_ALERT_CHAT_ID). Descoberto lendo a tabela sessions do Postgres
    # (user_id = chat_id puro, ver coordinator/CLAUDE.md) em vez de getUpdates — o bot
    # makima já está fazendo long-polling, então getUpdates sempre voltava vazio.
    #
    # `allow_from` (não `allowed_users` — 1ª correção, ver changelog em hermes/CLAUDE.md).
    # Aceito tanto solto sob `telegram:` quanto aninhado sob `extra:` — gateway/config.py
    # (`_merge_platform_map`) faz o bridge de `allow_from` do nível de cima pro `.extra`
    # automaticamente. O que REALMENTE importa: quando esta chave existe (não é `None`),
    # ela vira a AUTORIDADE ÚNICA de autorização do adaptador — curto-circuita
    # `TELEGRAM_ALLOWED_USERS` (env var) e o pareamento (`hermes pairing approve`)
    # completamente (`plugins/platforms/telegram/adapter.py`,
    # `_is_user_authorized_from_message`: `if adapter_allow_from is not None: ...`, sem
    # fallback pros outros mecanismos). Confirmado em produção: com
    # `TELEGRAM_HERMES_ALLOWED_USER_ID` ausente do Environment, `${...}` não interpola,
    # `allow_from` vira `["${TELEGRAM_HERMES_ALLOWED_USER_ID}"]` — uma string literal que
    # não é `None` — e nega TODO MUNDO em silêncio, inclusive o dono do bot, mesmo com
    # env var e pareamento configurados corretamente à parte. A causa raiz real do
    # bloqueio persistente documentado nas revisões anteriores deste arquivo era essa: a
    # variável simplesmente não estava setada no Environment da app Hermes no Dokploy.
    # Ou seja: `TELEGRAM_HERMES_ALLOWED_USER_ID` é OBRIGATÓRIA sempre que este bloco
    # `allow_from` existir — sem ela, o bot fica inacessível pra qualquer um.
    extra:
      allow_from:
        - "${TELEGRAM_HERMES_ALLOWED_USER_ID}"

  whatsapp:
    # Conector Baileys (sessão WhatsApp Web) — número dedicado, pareado via QR code
    # (`hermes whatsapp` dentro do container). Sem config declarativa de token: a sessão
    # pareada vive só no volume (whatsapp/session/creds.json).
    #
    # PROPOSITALMENTE sem `extra.allow_from` aqui — lição aprendida com o Telegram (ver
    # comentário acima e "Causa raiz real do bloqueio" em hermes/CLAUDE.md):
    # `plugins/platforms/whatsapp/adapter.py` usa a MESMA regra de precedência perigosa
    # (`if "allow_from" in config.extra: ... `, "select by key *presence*" — comentário
    # do próprio código-fonte) — se essa chave existisse aqui com um `${VAR}` e a env var
    # não estivesse setada no Dokploy, bloquearia todo mundo em silêncio, do mesmo jeito
    # que aconteceu no Telegram. O wizard `hermes whatsapp` já pergunta o número
    # autorizado interativamente e grava em `WHATSAPP_ALLOWED_USERS` dentro do
    # `$HERMES_HOME/.env` (arquivo do VOLUME, não deste repo) — a env var então vira a
    # única fonte, sem risco de string-literal-não-interpolada. Ver "Como parear o
    # WhatsApp" em hermes/CLAUDE.md.

  webhook:
    # Rotas de notificação genérica multi-canal (spec 064, User Story 5 / FR-011+FR-012)
    # — usado pelo scheduler/ pra push determinístico (--deliver-only, sem LLM) em
    # qualquer canal configurado. As rotas em si (notify-whatsapp/telegram/discord) são
    # criadas via `hermes webhook subscribe` (estado dinâmico, vive no volume
    # hermes_data — não neste arquivo estático). Alcançável só dentro da
    # dokploy-network, sem porta pública/Traefik — mesmo isolamento do makima-mcp
    # (ver mcp_servers/makima/CLAUDE.md). Ver scheduler/CLAUDE.md e scheduler/notify_channels.py.
    enabled: true
    extra:
      port: 8644
      secret: "${WEBHOOK_SECRET}"

  discord:
    bot_token: "${DISCORD_BOT_TOKEN}"
    # Diferente do Telegram/WhatsApp: `plugins/platforms/discord/adapter.py` usa
    # semântica OR, não autoridade única — `_is_allowed_user()` checa o pareamento
    # (`hermes pairing approve`) PRIMEIRO e incondicionalmente, antes mesmo de olhar
    # `allow_from`/`DISCORD_ALLOWED_USERS`. Ou seja, mesmo que `allow_from` abaixo fique
    # com um `${VAR}` não interpolado por engano, o pareamento continua funcionando como
    # rede de segurança — não é o mesmo risco de lockout total do Telegram. Ainda assim,
    # `DISCORD_HERMES_ALLOWED_USER_ID` PRECISA estar no Environment do Dokploy pra esta
    # allowlist funcionar de verdade (mesma mecânica de interpolação do Telegram).
    extra:
      allow_from:
        - "${DISCORD_HERMES_ALLOWED_USER_ID}"
